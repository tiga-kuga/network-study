<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NETWORK学習">
<link rel="manifest" href="manifest.webmanifest">
<title>MY STUDY 学習アプリ</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--sub:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#047857;--ng:#b91c1c}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 12px}
h1{font-size:20px;margin:0} .sub{font-size:12px;color:var(--sub);margin-top:4px}
main{padding:14px 14px 90px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.unit{cursor:pointer}.unit h2{font-size:18px;margin:0 0 6px}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}
.mapline{padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}.mapline:last-child{border:0}
.topic h3{margin:0 0 10px;font-size:18px}.topic h4{font-size:13px;margin:14px 0 6px;color:var(--accent)}
.topic ul{margin:6px 0 0 20px;padding:0}.topic li{margin:6px 0;line-height:1.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;background:#e5e7eb;color:#111827}
button.primary{background:var(--accent);color:#fff}button.good{background:#ecfdf5;color:var(--ok)}button.bad{background:#fef2f2;color:var(--ng)}
.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f8fafc;border:1px solid var(--line)}
.choice.selected{outline:2px solid var(--accent)}
.topic-return-highlight{outline:3px solid var(--accent);box-shadow:0 0 0 6px rgba(37,99,235,.12);transition:outline .25s,box-shadow .25s}
.notice{padding:12px;border-radius:12px;background:#eff6ff;font-size:13px;line-height:1.5}
.correct{background:#ecfdf5;color:var(--ok)}.wrong{background:#fef2f2;color:var(--ng)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:20}
nav button{background:transparent;padding:8px 3px;font-size:11px;color:var(--sub)}nav button.active{color:var(--accent)}
.small{font-size:12px;color:var(--sub)} .big{font-size:28px;font-weight:700}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}summary{font-weight:700;cursor:pointer}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0%}
a{color:var(--accent)}

.asset-panel{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.asset-title{font-size:17px;font-weight:800;margin:8px 0}.asset-meta{font-size:11px;color:var(--sub);margin-bottom:8px}.diagram{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.6}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto}.asset-table{width:100%;border-collapse:collapse;font-size:12px}.asset-table th,.asset-table td{border:1px solid var(--line);padding:7px}.asset-table th{background:#f1f5f9}.assetbtn{background:#eef2ff;color:#3730a3}.formula-btn{background:#ecfeff;color:#155e75}.table-btn{background:#f0fdf4;color:#166534}.flow-btn{background:#fff7ed;color:#9a3412}
.example-btn{background:#fdf2f8;color:#9d174d}

.original-btn{background:#fef3c7;color:#92400e}
.original-img{width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:white}
.original-meta{font-size:12px;color:var(--sub);line-height:1.55;margin:8px 0}
.zoom-link{display:inline-block;margin-top:10px;padding:10px 12px;border-radius:10px;background:#111827;color:white;text-decoration:none;font-weight:700}

.original-img{cursor:zoom-in}
.zoom-modal{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.94);display:flex;flex-direction:column}
.zoom-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;background:rgba(17,24,39,.95);color:#fff;position:sticky;top:0;z-index:2}
.zoom-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom-close{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#111827;font-weight:800}
.zoom-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;text-align:center;touch-action:pan-x pan-y pinch-zoom;display:flex;align-items:flex-start;justify-content:center}
.zoom-scroll img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 92px);object-fit:contain;background:#fff;margin:0 auto;transform-origin:top center}
.zoom-hint{font-size:11px;opacity:.75}


.zoom-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.zoom-action{border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 10px;background:#374151;color:#fff;font-weight:700;font-size:12px}
.zoom-scroll.original-size{display:block;text-align:left}
.zoom-scroll.original-size img{max-width:none;max-height:none;width:auto;height:auto;margin:0}

</style>
</head>
<body data-version="v64">
<header><h1>MY STUDY 学習アプリ</h1><div class="sub">科目 → 知識の地図 → 詳細 → 問題 → 間違えた論点へ戻る　<span style="opacity:.55">v64</span></div></header>
<main id="app"></main>
<nav>
<button data-tab="home" class="active">🏠<br>全体</button>
<button data-tab="topics">🧭<br>論点</button>
<button data-tab="quiz">📝<br>問題</button>
<button data-tab="review">⚡️<br>30秒</button>
</nav>
<script src="data.js"></script>
<script>
const D=window.APP_DATA, app=document.getElementById('app');
let state={tab:'home',unit:null,topic:null,q:0,quizTopic:null,selected:null,answered:false,scrollTarget:null,assetType:null,assetId:null};
let wrong=JSON.parse(localStorage.getItem('wrongTopics')||'[]');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function setTab(t){state.tab=t;state.unit=null;state.topic=null;if(t==='quiz')state.quizTopic=null;render();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function unitById(id){return D.units.find(u=>u.id===id)}
function topicById(id){for(const u of D.units){const t=u.topics.find(x=>x.id===id);if(t)return {u,t}}}
function goUnit(id){state.unit=id;state.topic=null;render()}
function goTopic(id){state.topic=id;state.tab='topics';state.assetType=null;state.assetId=null;render();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='topics'))}
function backToTopicList(id){state.topic=null;state.tab='topics';state.assetType=null;state.assetId=null;state.scrollTarget=id;render();}
function home(){
const cats=[...new Set(D.units.map(u=>u.category||'その他'))];
let out=`<div class="card"><div class="big">${D.units.length}単元</div><div class="small">複数科目を1つのiPhone学習アプリで管理</div></div>`;
for(const c of cats){
  const icon=c==='IT・ネットワーク'?'🌐':(c==='給与計算'?'💴':'📚');
  out+=`<div class="card"><h2>${icon} ${esc(c)}</h2><div class="small">タップして単元を開く</div></div>`;
  out+=D.units.filter(u=>(u.category||'その他')===c).map(u=>`<div class="card unit" onclick="goUnit('${u.id}')"><h2>${u.id} ${esc(u.title)}</h2><div class="small">${esc(u.summary)}</div><div style="margin-top:10px">${u.topics.map(t=>`<span class="pill">${esc(t.title)}</span>`).join('')}</div></div>`).join('');
}
return out;
}
function unitView(u){
return `<button onclick="state.unit=null;render()">← 全体へ</button><div class="card"><h2>${u.id} ${esc(u.title)}</h2><p>${esc(u.summary)}</p>${u.map.map(x=>`<div class="mapline">${esc(x)}</div>`).join('')}</div>`+
u.topics.map(t=>`<div class="card unit" onclick="goTopic('${t.id}')"><h3>${t.id} ${esc(t.title)}</h3><div class="small">${esc(t.overview)}</div></div>`).join('');
}

function assetById(type,id){const k=type==='original'?'original_assets':type==='visual'?'visuals':type==='formula'?'formulas':type==='table'?'tables':type==='flow'?'flows':'examples';return (D[k]||[]).find(x=>x.id===id)}
function openAsset(type,id){state.assetType=type;state.assetId=id;render(false);requestAnimationFrame(()=>document.getElementById('asset-panel')?.scrollIntoView({behavior:'smooth',block:'start'}))}
function closeAsset(){state.assetType=null;state.assetId=null;render(false)}
function assetButtons(t){return [...(t.visual_ids||[]).map(id=>`<button class="assetbtn" onclick="openAsset('visual','${id}')">図を見る</button>`),...(t.formula_ids||[]).map(id=>`<button class="assetbtn formula-btn" onclick="openAsset('formula','${id}')">数式を見る</button>`),...(t.table_ids||[]).map(id=>`<button class="assetbtn table-btn" onclick="openAsset('table','${id}')">比較を見る</button>`),...(t.flow_ids||[]).map(id=>`<button class="assetbtn flow-btn" onclick="openAsset('flow','${id}')">判断フローを見る</button>`),...(t.example_ids||[]).map(id=>`<button class="assetbtn example-btn" onclick="openAsset('example','${id}')">具体例を見る</button>`),...(t.original_asset_ids||[]).map(id=>{const a=assetById('original',id);return `<button class="assetbtn original-btn" onclick="openAsset('original','${id}')">${esc(a?.button_label||'原図を見る')}</button>`})].join('')}
function assetPanel(){if(!state.assetId)return '';const a=assetById(state.assetType,state.assetId);if(!a)return '';let b='';if(state.assetType==='visual'){b=`<div class="diagram">${(a.structure||[]).map(esc).join('\n')}</div>${a.points?.length?`<h4>見るポイント</h4><ul>${a.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`}else if(state.assetType==='formula'){b=`<div class="formula">${esc(a.formula)}</div><div class="small">LaTeX: ${esc(a.latex||'')}</div><h4>意味</h4><ul>${(a.meaning||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${a.example?`<h4>具体例</h4><div>${esc(a.example)}</div>`:''}`}else if(state.assetType==='table'){b=`<div style="overflow:auto"><table class="asset-table"><thead><tr>${(a.axes||[]).map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${(a.rows||[]).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}else if(state.assetType==='flow'){b=`<div class="diagram">${esc(a.start)}\n${(a.steps||[]).map(s=>`${s.question}\n├─YES → ${s.yes}\n└─NO → ${s.no}`).join('\n↓\n')}\n↓\n${esc(a.final)}</div>`}else if(state.assetType==='example'){b=`<div class="diagram">${(a.steps||[]).map((x,i)=>`${i+1}. ${x}`).join('\n↓\n')}</div>${a.point?`<h4>ポイント</h4><div>${esc(a.point)}</div>`:''}`}else{b=`<div class="original-meta"><b>PDF原図</b> / ${esc(a.source_pdf)} / PDF P.${esc(a.pdf_page)} / ${esc(a.type||'図')}</div><img class="original-img" src="${a.data_uri||esc(a.path)}" alt="${esc(a.title||a.id)}" onclick="openOriginalZoom('${a.id}')"><div class="original-meta"><b>この図で見るポイント：</b>${esc(a.view_point||'')}</div><button class="zoom-link" type="button" onclick="openOriginalZoom('${a.id}')">拡大表示</button>`}return `<div id="asset-panel" class="asset-panel"><button onclick="closeAsset()">× 閉じる</button><div class="asset-title">${esc(a.title||a.name||a.id)}</div><div class="asset-meta">${esc(a.id)}</div>${b}</div>`}

function openOriginalZoom(id){
  const a=assetById('original',id);
  if(!a)return;
  closeOriginalZoom();
  const overlay=document.createElement('div');
  overlay.id='original-zoom-modal';
  overlay.className='zoom-modal';
  overlay.innerHTML=
    `<div class="zoom-toolbar">
       <div style="min-width:0">
         <div class="zoom-title">${esc(a.title||a.id)}</div>
         <div class="zoom-hint">ピンチ操作・スクロールで拡大して確認できます</div>
       </div>
       <div class="zoom-actions">
         <button class="zoom-action zoom-fit" type="button">画面に合わせる</button>
         <button class="zoom-action zoom-original" type="button">原寸</button>
         <button class="zoom-close" type="button">閉じる</button>
       </div>
     </div>
     <div class="zoom-scroll">
       <img src="${a.data_uri||esc(a.path)}" alt="${esc(a.title||a.id)}">
     </div>`;
  const zoomScroll=overlay.querySelector('.zoom-scroll');
  overlay.querySelector('.zoom-close').addEventListener('click',closeOriginalZoom);
  overlay.querySelector('.zoom-fit').addEventListener('click',()=>zoomScroll.classList.remove('original-size'));
  overlay.querySelector('.zoom-original').addEventListener('click',()=>zoomScroll.classList.add('original-size'));
  document.body.appendChild(overlay);
  document.body.style.overflow='hidden';
}
function closeOriginalZoom(){
  const x=document.getElementById('original-zoom-modal');
  if(x)x.remove();
  document.body.style.overflow='';
}
function topics(){
if(state.topic){const z=topicById(state.topic);if(!z)return '';const {u,t}=z;const sec=(n,a)=>a&&a.length?`<h4>${n}</h4><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';return `<button onclick="backToTopicList('${t.id}')">← 論点一覧</button><div class="card topic"><div class="small">${u.id} / ${esc(u.title)}</div><h3>${t.id} ${esc(t.title)}</h3><h4>この論点の役割</h4><div>${esc(t.role)}</div><h4>概要</h4><div>${esc(t.overview)}</div>${sec('基本構造',t.structure)}${sec('原則',t.principles)}${sec('成立条件・適用条件',t.conditions)}${sec('結論・効果',t.effects)}${sec('例外',t.exceptions)}${sec('注意点',t.notes)}${sec('似た概念との違い',t.differences)}${sec('関連論点',t.related)}${sec('資格問題での着眼点',t.exam)}${(t.question_ids||[]).length?`<h4>関連問題ID</h4><div class="small">${t.question_ids.join(' / ')}</div>`:''}<div class="btnrow">${assetButtons(t)}<button class="primary" onclick="startTopicQuiz('${t.id}')">問題を解く</button></div>${assetPanel()}</div>`}return D.units.map(u=>`<div class="card"><h2>${u.id} ${esc(u.title)}</h2>${u.topics.map(t=>`<button id="topic-${t.id}" class="choice" onclick="goTopic('${t.id}')">${t.id}　${esc(t.title)}</button>`).join('')}</div>`).join('')}
function startTopicQuiz(tid){
const qs=D.questions.filter(q=>q.topic===tid);
if(!qs.length)return alert('この論点に紐づく確認問題はまだありません');
state.quizTopic=tid;
state.q=0;
state.tab='quiz';
state.selected=null;
state.answered=false;
render();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='quiz'))
}
function quiz(){
const pool=state.quizTopic?D.questions.filter(x=>x.topic===state.quizTopic):D.questions;
if(!pool.length){
return `<div class="card"><h2>問題がありません</h2><div class="small">この論点に紐づく確認問題はまだ登録されていません。</div><div class="btnrow"><button onclick="state.tab='topics';state.quizTopic=null;render()">論点へ戻る</button></div></div>`;
}
if(state.q>=pool.length)state.q=0;
const q=pool[state.q], pct=Math.round((state.q)/pool.length*100);
let feedback='';
if(state.answered){
  const ok=state.selected===q.answer;
  const ab=[...(q.visual_ids||[]).map(id=>`<button class="assetbtn" onclick="state.topic='${q.topic}';state.tab='topics';openAsset('visual','${id}')">図を見る</button>`),...(q.formula_ids||[]).map(id=>`<button class="assetbtn formula-btn" onclick="state.topic='${q.topic}';state.tab='topics';openAsset('formula','${id}')">数式を見る</button>`),...(q.table_ids||[]).map(id=>`<button class="assetbtn table-btn" onclick="state.topic='${q.topic}';state.tab='topics';openAsset('table','${id}')">比較を見る</button>`),...(q.flow_ids||[]).map(id=>`<button class="assetbtn flow-btn" onclick="state.topic='${q.topic}';state.tab='topics';openAsset('flow','${id}')">判断フローを見る</button>`),...(q.example_ids||[]).map(id=>`<button class="assetbtn example-btn" onclick="state.topic='${q.topic}';state.tab='topics';openAsset('example','${id}')">具体例を見る</button>`),...(q.original_asset_ids||[]).map(id=>{const a=assetById('original',id);return `<button class="assetbtn original-btn" onclick="state.topic='${q.topic}';state.tab='topics';openAsset('original','${id}')">${esc(a?.button_label||'原図を見る')}</button>`})].join('');feedback=`<div class="notice ${ok?'correct':'wrong'}"><b>${ok?'正解':'不正解'}</b><br>正解：${esc(q.answer)}<br>${esc(q.explain)}<br><b>判断ポイント：</b>${esc(q.point)}<div class="btnrow">${ab}<button class="good" onclick="goTopic('${q.topic}')">詳細へ戻る</button></div></div>`
}
const mode=state.quizTopic?`<div class="notice">この論点の問題だけを出題中：<b>${esc(state.quizTopic)}</b></div>`:'';
return `<div class="card">${mode}<div class="small">問題 ${state.q+1} / ${pool.length}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><h2>${esc(q.type)}｜${esc(q.q)}</h2>${q.choices.map((c,i)=>`<button type="button" class="choice ${state.selected===c?'selected':''}" onclick="selectChoice(${i})">${esc(c)}</button>`).join('')}<div class="btnrow"><button class="primary" onclick="answerQ()">答え合わせ</button><button onclick="nextQ()">次の問題</button>${state.quizTopic?`<button onclick="goTopic('${state.quizTopic}')">この論点へ戻る</button>`:''}</div>${feedback}</div><div class="card"><b>間違えた論点</b><div class="small">${wrong.length?wrong.join(' / '):'まだありません'}</div><button class="bad" style="margin-top:8px" onclick="wrong=[];localStorage.setItem('wrongTopics','[]');render()">履歴を消す</button></div>`;
}
function selectChoice(i){const pool=state.quizTopic?D.questions.filter(x=>x.topic===state.quizTopic):D.questions;const q=pool[state.q];if(!q||!q.choices||i<0||i>=q.choices.length)return;state.selected=q.choices[i];state.answered=false;render(false)}
function answerQ(){if(state.selected==null)return alert('選択肢を選んでください');state.answered=true;const pool=state.quizTopic?D.questions.filter(x=>x.topic===state.quizTopic):D.questions;const q=pool[state.q];if(state.selected!==q.answer&&!wrong.includes(q.topic)){wrong.push(q.topic);localStorage.setItem('wrongTopics',JSON.stringify(wrong))}render()}
function nextQ(){const pool=state.quizTopic?D.questions.filter(x=>x.topic===state.quizTopic):D.questions;state.q=(state.q+1)%pool.length;state.selected=null;state.answered=false;render()}
function review(){
return D.units.map(u=>`<div class="card"><div class="small">${esc(u.category||'')}</div><h2>${u.id} ${esc(u.title)}</h2>${u.review.map(x=>`<div class="mapline">✓ ${esc(x)}</div>`).join('')}</div>`).join('');
}
function render(resetScroll=true){if(state.tab==='home')app.innerHTML=state.unit?unitView(unitById(state.unit)):home(); else if(state.tab==='topics')app.innerHTML=topics(); else if(state.tab==='quiz')app.innerHTML=quiz(); else app.innerHTML=review();
const target=state.scrollTarget;
if(target){state.scrollTarget=null;requestAnimationFrame(()=>{const el=document.getElementById('topic-'+target);if(el){el.scrollIntoView({behavior:'instant',block:'center'});el.classList.add('topic-return-highlight');setTimeout(()=>el.classList.remove('topic-return-highlight'),1400);}});}
else if(resetScroll)window.scrollTo({top:0,behavior:'instant'});}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
